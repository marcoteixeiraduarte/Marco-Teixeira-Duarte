name: Aufgabe
description: Nächste Suche oder Korrektur. Chat und Cloud lesen das Issue.
title: "[Aufgabe] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Der Agent startet über `AGENTS.md`, `STAND.md` und `regeln/06-forschung.md`.
        Eine Frage, ein begrenzter Bereich. Herkunft vorhandenen Wissens nennen.
  - type: textarea
    id: ziel
    attributes:
      label: Ziel
      description: Was soll festliegen, wenn die Aufgabe fertig ist?
      placeholder: z. B. Taufe Roza Maria in Alvorge 1808–1852 als Blatt oder als Nulltreffer in suchen.md
    validations:
      required: true
  - type: dropdown
    id: linie
    attributes:
      label: Linie
      options:
        - ramo paterno (Duarte / Freire Bicho)
        - ramo materno (Torre / Reis / Teixeira)
        - Ort / Register
        - Regel / Ablage
        - weiss nicht
    validations:
      required: true
  - type: textarea
    id: nicht
    attributes:
      label: Nicht tun
      description: Was nicht blind wiederholt werden soll. Gegenlese gegen die Primärquelle bleibt erlaubt, wenn du den Anlass nennst.
      placeholder: z. B. nicht in Cumeeira nach der Heirat 1922 suchen
  - type: input
    id: frage
    attributes:
      label: Eine Frage
      placeholder: z. B. Taufe Roza Maria, Alvorge, Eltern der Heirat 1851
  - type: input
    id: band
    attributes:
      label: Signatur und Bilder
      placeholder: z. B. PANS02 Batismos 1822–1852, m0001–m0040
  - type: dropdown
    id: herkunft
    attributes:
      label: Herkunft des vorhandenen Wissens
      options:
        - Originalakt
        - Familienunterlage
        - mündliche Angabe
        - Schlussfolgerung
        - noch offen
